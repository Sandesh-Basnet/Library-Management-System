            position: relative;
            overflow: hidden;
        }

        .wax-seal::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);

            box-shadow: 0 4px 12px -6px theme('colors.tertiary-fixed');
        }

        @keyframes drift {
            from { transform: translateY(0) rotate(0deg); opacity: 0; }
            50% { opacity: 0.5; }
            to { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);

<script>
        // Atmospheric Dust Particle Generator
        const container = document.getElementById('particle-container');
        const particleCount = 40;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            // Randomize properties
            const size = Math.random() * 3 + 1;
            const left = Math.random() * 100;
            const duration = Math.random() * 20 + 10;
            const delay = Math.random() * 20;
            
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${left}%`;
            particle.style.bottom = `-20px`;
            particle.style.animationDuration = `${duration}s`;
            particle.style.animationDelay = `-${delay}s`;
            
            container.appendChild(particle);
        }

        // Micro-interaction for form inputs
        const inputs = document.querySelectorAll('.input-ledger');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.previousElementSibling.classList.add('text-tertiary-container');
                input.previousElementSibling.style.fontVariationSettings = "'FILL' 1";
            });
            input.addEventListener('blur', () => {
                input.previousElementSibling.classList.remove('text-tertiary-container');
                input.previousElementSibling.style.fontVariationSettings = "'FILL' 0";
            });
        });
    </script>
